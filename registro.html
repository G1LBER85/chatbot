<!doctype html>
<html lang="es">
  <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Registro de Acceso</title>
        
        <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
        />
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Poppins", sans-serif;
            }

            body {
                height: 100vh;
                background: whitesmoke;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .pantalla {
                width: 100%;
                height: 100vh;
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            /* LADO IZQUIERDO */

            .lado-izq {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 50px 60px;
                gap: 28px;
                position: relative;
                
            }

            .lado-izq::before{
                content: "";
                position: absolute;
                inset: 0;
                background-image: url('img/logo_chiapas.svg');
                background-repeat: no-repeat;
                background-size: 60%;  /*ultima modificacion*/
                background-position: center;
                opacity: 0.1;
            }

            /*.lado-izq > * {
                position: relative;
            }*/

            .icono-check {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            .icono-check.entrada {
                background: blue;
            }

            .icono-check.salida{
                background: red;
            }

            .icono-check svg {
                width: 100px;
                height: 100px;
                stroke: greenyellow;
                fill: none;
                stroke-width: 4;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .titulo-registro {
                text-align: center;
                line-height: 1.5;
            }

            .titulo-registro .exclamacion {
                font-size: 52px;
                font-weight: 800;
            }

            .titulo-registro .exclamacion.entrada {
                color: blue;
            }

            .titulo-registro .exclamacion.salida {

                color: red;
            }

            .titulo-registro .exitoso {
                font-size: 52px;
                font-weight: 800;
            }

            .titulo-registro .exitoso.entrada {
                color: green;
            }

            .titulo-registro .exitoso.salida {
                color: blueviolet;
            }

            .badge-tipo {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                border-radius: 30px;
                padding: 10px 24px;
                font-size: 25px;
                font-weight: 700;
            }

            .badge-tipo.entrada {
                background: blue;
                border: 6px inset black;
                color: yellow;
            }

            .badge-tipo.salida {
                background: red;
                border: 6px outset black;
                color: yellow;
            }

            .badge-tipo svg {
                width: 30px;
                height: 30px;
                stroke: currentColor;
                fill: none;
                stroke-width: 3;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .datos-card {
                width: 100%;
                border-radius: 20px;
                padding: 22px 28px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                background: whitesmoke;
            }

            .datos-card.entrada {
                border: 6px inset blue;
            }

            .datos-card.salida {
                border: 6px outset red;
            }

            .dato-fila {
                display: flex;
                align-items: center;
                gap: 14px;
            }

            .dato-icono {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: yellow;
                border: 2px solid blue;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .salida .dato-icono {
                border: 2px solid red;
            }

            .dato-icono svg {
                width: 18px;
                height: 18px;
                stroke: black;
                fill: none;
                stroke-width: 3;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .dato-texto {
                font-size: 22px;
                font-weight: 700;
                color: Black;
                line-height: 1.5;
            }

            .dato-fecha {
                font-size: 22px;
                color: purple;
                font-weight: 700;
                line-height: 1.5;
            }

            /* LADO DERECHO: FOTO */

            .lado-der {
                position: relative;
                overflow: hidden;
                background: white;
            }

            #fotoAlumno {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center top;
                display: block;
            }

            .foto-placeholder {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: black;
            }

            .foto-placeholder svg {
                width: 140px;
                height: 140px;
                stroke: black;
                fill: none;
                stroke-width: 1;
            }

            /* BANNER INFERIOR */

            .banner {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                color: yellow;
                text-align: center;
                padding: 16px;
                font-size: 24px;
                font-weight: 600;
                border: 2px dashed black;
            }

            .banner.entrada{
                background: blue;

            }

            .banner.salida {
                background: red;
            }
        </style>
  </head>
  
  <body>
        <div class="pantalla" id="pantalla">
            <div class="lado-izq" id="ladoIzq">
                <div class="icono-check" id="iconoCheck">
                    <svg viewBox="0 0 24 24" id="svgCheck">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>                    
                </div>

                <div class="titulo-registro">
                    <div class="exclamacion" id="tituloExclamacion">
                        ¡REGISTRO
                    </div>

                    <div class="exitoso" id="tituloExitoso">
                        EXITOSO!
                    </div>
                </div>

                <div class="badge-tipo" id="badgeTipo">
                    <svg viewBox="0 0 24 24" id="badgeIcono">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>

                    <span id="estadoTexto">ENTRADA REGISTRADA</span>
                </div>

                <div class="datos-card" id="datosCard">
                    <div class="dato-fila">
                        <div class="dato-icono">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </div>

                        <div>
                            <div class="dato-texto" id="nombreAlumno">Nombre del alumno</div>
                        </div>
                    </div>

                    <div class="dato-fila">
                        <div class="dato-icono">
                            <svg viewBox="0 0 24 24">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                                <path d="M6 12v5c3 3 9 3 12 0v-5" />
                            </svg>
                        </div>

                        <div>
                            <div class="dato-texto" id="grupoAlumno">
                                -- Semestre | Grupo --
                            </div>
                        </div>
                    </div>

                    <div class="dato-fila">
                        <div class="dato-icono">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" />
                                <polyline points="12 6 12 12 16 14" />
                            </svg>
                        </div>

                        <div>
                            <div class="dato-texto" id="horaAlumno">--:-- --</div>
                        </div>

                        <div class="dato-fecha" id="fechaAlumno">-- de ------ de ----</div>
                    </div>
                </div>
            </div>

            <div class="lado-der" id="ladoDer">
                <div class="foto-placeholder" id="fotoPlaceholder">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
            
                <img id="fotoAlumno" src="" alt="Foto del alumno" />
                
                <div class="banner" id="bannerMensaje">
                    Bienvenido(a), que tengas un excelente día ♥
                </div>
            </div>
        </div>

        <script>
            function aplicarModoEntrada() {
                document.getElementById("datosCard").classList.add("entrada");
                document.getElementById("ladoDer");
                document.getElementById("bannerMensaje").classList.add("entrada");
                document.getElementById("badgeTipo").classList.add("entrada");
                document.getElementById("iconoCheck").classList.add("entrada"); //Es el fondo de la palomita
                document.querySelectorAll(".dato-icono svg");
                document.getElementById("tituloExclamacion").classList.add("entrada");
                document.getElementById("tituloExitoso").classList.add("entrada");
                document.getElementById("fotoPlaceholder").style.background = "#d1fae5";
                const iconoBadge = document.getElementById("badgeIcono");
                iconoBadge.innerHTML =
                '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>';
            }

            function aplicarModoSalida() {
                document.getElementById("datosCard").classList.add("salida");
                document.getElementById("ladoDer");
                document.getElementById("bannerMensaje").classList.add("salida");
                document.getElementById("badgeTipo").classList.add("salida");
                document.getElementById("iconoCheck").classList.add("salida");
                document.querySelectorAll(".dato-icono svg");
                document.getElementById("tituloExclamacion").classList.add("salida");
                document.getElementById("tituloExitoso").classList.add("salida");
                document.getElementById("fotoPlaceholder").style.background = "#dbeafe";
                const iconoBadge = document.getElementById("badgeIcono");
                iconoBadge.innerHTML =
                '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>';
            }

            async function cargarRegistro() {
                try {
                const respuesta = await fetch("api/ultimo-registro.php");   //Cambié de /api/ultimo-registro.php a api/ultimo-registro.php para que aparezca los datos
                const datos = await respuesta.json();                       // en la pantalla de bienvenida.

                const esSalida = datos.tipo === "salida";

                if (esSalida) {
                    aplicarModoSalida();
                } else {
                    aplicarModoEntrada();
                }

                const foto = document.getElementById("fotoAlumno");
                const placeholder = document.getElementById("fotoPlaceholder");
                if (datos.foto) {
                    foto.src = datos.foto;
                    foto.style.display = "block";
                    placeholder.style.display = "none";
                } else {
                    foto.style.display = "none";
                    placeholder.style.display = "flex";
                }

                document.getElementById("nombreAlumno").textContent =
                    datos.nombre || "—";
                document.getElementById("grupoAlumno").textContent =
                    datos.grupo || "—";
                document.getElementById("horaAlumno").textContent = datos.hora || "—";
                document.getElementById("fechaAlumno").textContent =
                    datos.fecha || "—";

                document.getElementById("estadoTexto").textContent = esSalida
                    ? "SALIDA REGISTRADA"
                    : "ENTRADA REGISTRADA";

                document.getElementById("bannerMensaje").textContent = esSalida
                    ? "Hasta luego, que tengas un buen día ♥"
                    : "Bienvenido(a), que tengas un excelente día ♥";
                } catch (error) {
                console.error("Error al cargar registro:", error);
                }
            }

            // Aplicar modo inmediatamente desde la URL para no esperar la consulta
            const params = new URLSearchParams(window.location.search);
            const tipoUrl = params.get("tipo");
            if (tipoUrl === "salida") {
                aplicarModoSalida();
            } else {
                aplicarModoEntrada();
            }

            cargarRegistro();
            setInterval(cargarRegistro, 3000);

            setTimeout(function () {
                window.location.href = "cliente.php";
            }, 3000);   //Reduje el tiempo de espera a 3000 ms.
        </script>
    </body>
</html>
