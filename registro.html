<!doctype html>
<html lang="es">
  <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Registro de Acceso</title>
        
        <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
        />
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Poppins", sans-serif;
            }

            body {
                height: 100vh;
                background: #e8f4ec;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .pantalla {
                width: 100%;
                height: 100vh;
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            /* LADO IZQUIERDO */

            .lado-izq {
                background: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 50px 60px;
                gap: 28px;
            }

            .icono-check {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                background: #16a34a;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            .icono-check svg {
                width: 65px;
                height: 65px;
                stroke: white;
                fill: none;
                stroke-width: 3;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .destellos {
                position: absolute;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                pointer-events: none;
            }

            .titulo-registro {
                text-align: center;
                line-height: 1.1;
            }

            .titulo-registro .exclamacion {
                font-size: 52px;
                font-weight: 800;
                color: #0a2d73;
            }

            .titulo-registro .exitoso {
                font-size: 52px;
                font-weight: 800;
                color: #16a34a;
            }

            .badge-tipo {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                background: #dcfce7;
                border: 2px solid #16a34a;
                border-radius: 30px;
                padding: 10px 24px;
                font-size: 18px;
                font-weight: 700;
                color: #166534;
            }

            .badge-tipo.salida {
                background: #dbeafe;
                border-color: #2563eb;
                color: #1e40af;
            }

            .badge-tipo svg {
                width: 20px;
                height: 20px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2.5;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .datos-card {
                width: 100%;
                background: #f0fdf4;
                border-radius: 20px;
                border: 1.5px solid #bbf7d0;
                padding: 22px 28px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .datos-card.salida {
                background: #eff6ff;
                border-color: #bfdbfe;
            }

            .dato-fila {
                display: flex;
                align-items: center;
                gap: 14px;
            }

            .dato-icono {
                width: 38px;
                height: 38px;
                border-radius: 50%;
                background: white;
                border: 1.5px solid #bbf7d0;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }

            .salida .dato-icono {
                border-color: #bfdbfe;
            }

            .dato-icono svg {
                width: 18px;
                height: 18px;
                stroke: #16a34a;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .salida .dato-icono svg {
                stroke: #2563eb;
            }

            .dato-texto {
                font-size: 18px;
                font-weight: 600;
                color: #0a2d73;
                line-height: 1.2;
            }

            .dato-sub {
                font-size: 14px;
                color: #4a6fa5;
            }

            /* LADO DERECHO: FOTO */

            .lado-der {
                position: relative;
                overflow: hidden;
                background: #d1fae5;
            }

            .lado-der.salida {
                background: #dbeafe;
            }

            #fotoAlumno {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: center top;
                display: block;
            }

            .foto-placeholder {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #d1fae5;
            }

            .foto-placeholder svg {
                width: 140px;
                height: 140px;
                stroke: #86efac;
                fill: none;
                stroke-width: 1;
            }

            /* BANNER INFERIOR */

            .banner {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: #16a34a;
                color: white;
                text-align: center;
                padding: 16px;
                font-size: 20px;
                font-weight: 600;
            }

            .banner.salida {
                background: #2563eb;
            }

            /* DECORACIONES */

            .deco {
                position: absolute;
                border-radius: 50%;
                opacity: 0.5;
            }
        </style>
  </head>
  
  <body>
        <div class="pantalla" id="pantalla">
            <div class="lado-izq" id="ladoIzq">
                <div class="icono-check" id="iconoCheck">
                    <svg viewBox="0 0 24 24" id="svgCheck">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>

                    <svg
                        class="destellos"
                        viewBox="0 0 120 120"
                        xmlns="http://www.w3.org/2000/svg"
                        id="destellosSvg">

                        <circle cx="10" cy="30" r="5" fill="#86efac" opacity="0.7" />
                        <circle cx="110" cy="25" r="4" fill="#4ade80" opacity="0.6" />
                        <circle cx="20" cy="90" r="6" fill="#16a34a" opacity="0.5" />
                        <circle cx="100" cy="95" r="4" fill="#86efac" opacity="0.7" />
                        
                        <rect
                            x="55"
                            y="2"
                            width="8"
                            height="8"
                            rx="2"
                            fill="#4ade80"
                            opacity="0.6"
                            transform="rotate(20 59 6)"
                        />

                        <rect
                            x="5"
                            y="55"
                            width="7"
                            height="7"
                            rx="2"
                            fill="#86efac"
                            opacity="0.5"
                            transform="rotate(-15 8 58)"
                        />

                        <rect
                            x="107"
                            y="58"
                            width="7"
                            height="7"
                            rx="2"
                            fill="#4ade80"
                            opacity="0.6"
                            transform="rotate(30 110 61)"
                        />
                    </svg>
                </div>

                <div class="titulo-registro">
                    <div class="exclamacion">
                        ¡REGISTRO
                    </div>

                    <div class="exitoso" id="tituloExitoso">
                        EXITOSO!
                    </div>
                </div>

                <div class="badge-tipo" id="badgeTipo">
                    <svg viewBox="0 0 24 24" id="badgeIcono">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>

                    <span id="estadoTexto">ENTRADA REGISTRADA</span>
                </div>

                <div class="datos-card" id="datosCard">
                    <div class="dato-fila">
                        <div class="dato-icono">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </div>

                        <div>
                            <div class="dato-texto" id="nombreAlumno">Nombre del alumno</div>
                        </div>
                    </div>

                    <div class="dato-fila">
                        <div class="dato-icono">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path
                                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
                                />
                            </svg>
                        </div>

                        <div>
                            <div class="dato-texto" id="grupoAlumno">
                                -- Semestre | Grupo --
                            </div>
                        </div>
                    </div>

                    <div class="dato-fila">
                        <div class="dato-icono">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" />
                                <polyline points="12 6 12 12 16 14" />
                            </svg>
                        </div>

                        <div>
                            <div class="dato-texto" id="horaAlumno">--:-- --</div>
                            <div class="dato-sub" id="fechaAlumno">-- de ------ de ----</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lado-der" id="ladoDer">
                <div class="foto-placeholder" id="fotoPlaceholder">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
            
                <img id="fotoAlumno" src="" alt="Foto del alumno" />
                
                <div class="banner" id="bannerMensaje">
                    Bienvenido(a), que tengas un excelente día ♥
                </div>
            </div>
        </div>

        <script>
            function aplicarModoSalida() {
                document.getElementById("datosCard").classList.add("salida");
                document.getElementById("ladoDer").classList.add("salida");
                document.getElementById("bannerMensaje").classList.add("salida");
                document.getElementById("badgeTipo").classList.add("salida");
                document.getElementById("iconoCheck").style.background = "#2563eb";
                document
                .querySelectorAll(".dato-icono svg")
                .forEach((s) => (s.style.stroke = "#2563eb"));
                document
                .getElementById("destellosSvg")
                .querySelectorAll("circle, rect")
                .forEach((el) => {
                    el.setAttribute("fill", "#93c5fd");
                });
                document.getElementById("tituloExitoso").style.color = "#2563eb";
                document.getElementById("fotoPlaceholder").style.background = "#dbeafe";
                const iconoBadge = document.getElementById("badgeIcono");
                iconoBadge.innerHTML =
                '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>';
            }

            function resetearModoEntrada() {
                document.getElementById("datosCard").classList.remove("salida");
                document.getElementById("ladoDer").classList.remove("salida");
                document.getElementById("bannerMensaje").classList.remove("salida");
                document.getElementById("badgeTipo").classList.remove("salida");
                document.getElementById("iconoCheck").style.background = "#16a34a";
                document
                .querySelectorAll(".dato-icono svg")
                .forEach((s) => (s.style.stroke = "#16a34a"));
                document
                .getElementById("destellosSvg")
                .querySelectorAll("circle")
                .forEach((el, i) => {
                    el.setAttribute("fill", i % 2 === 0 ? "#86efac" : "#4ade80");
                });
                document
                .getElementById("destellosSvg")
                .querySelectorAll("rect")
                .forEach((el) => {
                    el.setAttribute("fill", "#4ade80");
                });
                document.getElementById("tituloExitoso").style.color = "#16a34a";
                document.getElementById("fotoPlaceholder").style.background = "#d1fae5";
                const iconoBadge = document.getElementById("badgeIcono");
                iconoBadge.innerHTML =
                '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>';
            }

            async function cargarRegistro() {
                try {
                const respuesta = await fetch("api/ultimo-registro.php");   //Cambié de /api/ultimo-registro.php a api/ultimo-registro.php para que aparezca los datos
                const datos = await respuesta.json();                       // en la pantalla de bienvenida.

                const esSalida = datos.tipo === "salida";

                if (esSalida) {
                    aplicarModoSalida();
                } else {
                    resetearModoEntrada();
                }

                const foto = document.getElementById("fotoAlumno");
                const placeholder = document.getElementById("fotoPlaceholder");
                if (datos.foto) {
                    foto.src = datos.foto;
                    foto.style.display = "block";
                    placeholder.style.display = "none";
                } else {
                    foto.style.display = "none";
                    placeholder.style.display = "flex";
                }

                document.getElementById("nombreAlumno").textContent =
                    datos.nombre || "—";
                document.getElementById("grupoAlumno").textContent =
                    datos.grupo || "—";
                document.getElementById("horaAlumno").textContent = datos.hora || "—";
                document.getElementById("fechaAlumno").textContent =
                    datos.fecha || "—";

                document.getElementById("estadoTexto").textContent = esSalida
                    ? "SALIDA REGISTRADA"
                    : "ENTRADA REGISTRADA";

                document.getElementById("bannerMensaje").textContent = esSalida
                    ? "Hasta luego, que tengas un buen día ♥"
                    : "Bienvenido(a), que tengas un excelente día ♥";
                } catch (error) {
                console.error("Error al cargar registro:", error);
                }
            }

            // Aplicar modo inmediatamente desde la URL para no esperar la consulta
            const params = new URLSearchParams(window.location.search);
            const tipoUrl = params.get("tipo");
            if (tipoUrl === "salida") {
                aplicarModoSalida();
            } else {
                resetearModoEntrada();
            }

            cargarRegistro();
            setInterval(cargarRegistro, 3000);

            setTimeout(function () {
                window.location.href = "cliente.php";
            }, 6000);
        </script>
    </body>
</html>
